<script>
(function(){

  let current = 700 + Math.floor(Math.random() * 80);

  const el = document.getElementById("viewers");

  function update(){

    current += Math.floor(Math.random() * 15) - 5;

    if (current < 620) current = 620;
    if (current > 980) current = 980;

    el.textContent = current + " personas están viendo ahora";

    setTimeout(update, 2000 + Math.random() * 3000);
  }

  update();

})();
</script>

<!-- TTCLID -->
<script>
(function () {

  const ttclid =
    new URLSearchParams(window.location.search).get("ttclid");

  if (!ttclid) return;

  const interval = setInterval(() => {

    const buttons = document.querySelectorAll("a");

    buttons.forEach(btn => {

      if (
        btn.href &&
        btn.href.includes("pay.hotmart.com") &&
        !btn.href.includes("&src=")
      ) {

        btn.href += "&src=" + encodeURIComponent(ttclid);

        console.log("TTCLID adicionado ao checkout:", btn.href);

        clearInterval(interval);
      }

    });

  }, 1000);

})();
</script>
